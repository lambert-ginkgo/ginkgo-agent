# 内置默认值（不含密钥）。密钥请走环境变量 DEEPSEEK_API_KEY / EMBEDDING_API_KEY，
# 或本地配置文件 config/application.properties（已被 .gitignore 忽略）
ginkgo.model.api-key=
ginkgo.model.base-url=https://api.deepseek.com
ginkgo.model.name=deepseek-chat

# 向量模型（E04 知识库问答）：默认阿里云百炼 OpenAI 兼容端点，可换任意兼容服务。
# Key 只走环境变量 EMBEDDING_API_KEY 或本地配置文件，不入库。
ginkgo.embedding.api-key=
ginkgo.embedding.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ginkgo.embedding.model-name=qwen3.7-text-embedding-flash
ginkgo.embedding.dimensions=1024
